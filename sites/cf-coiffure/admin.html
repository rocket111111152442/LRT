<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace salon — CF Coiffure</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#12305c">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin">

<header class="admin-bar">
  <div class="wrap">
    <a class="logo" href="/"><b>CF</b><span>Salon</span></a>
    <div class="bar-actions" id="bar-actions" hidden>
      <button class="btn small" data-open="create">+ Rendez-vous</button>
      <button class="btn small outline" data-open="block">Bloquer</button>
      <button class="btn small outline" id="export">Export</button>
      <button class="btn small outline" id="logout">Quitter</button>
    </div>
  </div>
</header>

<main class="admin-main">
  <form class="card login-card" id="login">
    <h1 style="font-size:1.8rem">Espace salon</h1>
    <div class="field"><input type="password" name="pw" placeholder="Mot de passe" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%">Entrer</button>
    <div id="login-err" role="alert"></div>
  </form>

  <div id="dash" hidden>
    <div class="toolbar">
      <div class="group">
        <button class="icon-btn" data-nav="-1" aria-label="Précédent">‹</button>
        <button class="btn small outline" data-nav="0">Aujourd'hui</button>
        <button class="icon-btn" data-nav="1" aria-label="Suivant">›</button>
        <input type="date" id="pick" aria-label="Aller à la date">
        <h2 id="title"></h2>
      </div>
      <div class="seg" role="group" aria-label="Vue">
        <button data-view="day" aria-pressed="true">Jour</button>
        <button data-view="week" aria-pressed="false">Semaine</button>
        <button data-view="list" aria-pressed="false">Liste</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="view"></div>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>

<script src="/assets/js/main.js" defer></script>
<script src="/assets/js/admin.js" defer></script>
</body>
</html>
