<svg xmlns="http://www.w3.org/2000/svg" width="372" height="148" viewBox="0 0 372 148" role="img" aria-label="Suisse-Conseils Management">
  <defs>
    <linearGradient id="blob" x1="6%" y1="14%" x2="92%" y2="88%">
      <stop offset="0" stop-color="#8b1418"/>
      <stop offset=".4" stop-color="#c2222a"/>
      <stop offset=".76" stop-color="#9d181d"/>
      <stop offset="1" stop-color="#7a1013"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset=".45" stop-color="#cccccc"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </linearGradient>
  </defs>

  <!-- reflet argenté, en arrière-plan -->
  <path d="M212 118c40-2 74-13 94-28 7 18-10 38-46 47-31 8-57 3-66-5-4-5 4-11 18-14Z" fill="url(#swoosh)"/>

  <!-- galet rouge -->
  <path d="M16 58C32 24 92 7 150 13c42 4 69 17 73 30 5 16-23 33-73 41-64 10-122 4-134-9-6-6-6-11 0-17Z" fill="url(#blob)"/>
  <path d="M16 58C32 24 92 7 150 13c42 4 69 17 73 30-39-23-99-31-151-25-25 3-42 8-56 15Z" fill="url(#gloss)"/>

  <!-- SUISSE -->
  <text x="20" y="64" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="47" font-style="italic" font-weight="800" fill="#ffffff" letter-spacing="-1.4">SUISSE</text>

  <!-- CONSEILS -->
  <text x="126" y="92" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.6">CONSEILS</text>

  <!-- MANAGEMENT -->
  <text x="132" y="118" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#b9b9b9" letter-spacing="5.2">MANAGEMENT</text>

  <!-- croix suisse -->
  <g transform="translate(340 44) rotate(-14)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#b41f24"/>
    <path d="M-5.8 -2h3.8v-3.8h4v3.8h3.8v4h-3.8v3.8h-4v-3.8h-3.8Z" fill="#fff"/>
  </g>
</svg>
