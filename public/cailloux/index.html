<!DOCTYPE html>
<html lang="fr">
<head>

<body data-theme="dark">

<div id="layout">

  <aside id="sidebar">
    <div class="logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="52" rx="22" ry="9" fill="#515c6b"/>
        <ellipse cx="32" cy="38" rx="16" ry="8" fill="#6b7787"/>

      </svg>
      <div>
        <div class="t">Cail<span>loux</span></div>
        <div class="sub">Un caillou à la fois</div>
      </div>
    </div>
    <nav id="nav-side"></nav>
    <div class="sidebar-foot">

      <div>v1.0 · 100 % gratuit</div>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
  </main>

</div>

<nav id="bottomnav"></nav>

<div id="modal-root" onclick="if(event.target===this)A.closeModal()"></div>

<div id="rest-overlay">
  <div class="l">Repos</div>
  <div class="t" id="rest-time">90</div>
  <div class="row">
    <button class="btn sec" onclick="A.restAdd(15)">+15 s</button>
    <button class="btn" onclick="A.restSkip()">Passer ➔</button>
  </div>
  <div class="muted" id="rest-next"></div>
